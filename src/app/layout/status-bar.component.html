<footer class="statusbar mono">
  <div class="sb-left">
    <span class="sb-item brand"><span class="git-dot"></span> main</span>
    <span class="sb-item">↑ building at
      <a class="a-link" href="https://www.arive.com/" target="_blank" rel="noopener"
         aria-label="ARIVE — company website, opens in a new tab">ARIVE</a>
    </span>
    <span class="sb-item hide-sm">{{ links.location }}</span>
  </div>
  <div class="sb-right">
    <span class="sb-item hide-sm">UTF-8</span>
    <span class="sb-item hide-sm">TypeScript</span>
    <span class="sb-item">§ {{ activeFile() }}</span>
    <span class="sb-item theme-ind">◎ {{ theme() }}</span>
  </div>
</footer>
