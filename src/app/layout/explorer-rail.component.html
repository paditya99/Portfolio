<aside class="rail" [class.open]="menuOpen()">
  <p class="rail-title mono">EXPLORER</p>
  <p class="rail-root mono"><span class="caret">▾</span> ADITYA-PATHAK</p>
  <nav aria-label="Sections">
    <ul>
      @for (n of nav; track n.id) {
        <li>
          <a class="rail-item" [class.active]="active() === n.id"
             [href]="'#' + n.id" (click)="go(n.id, $event)">
            <svg class="ri-icon" viewBox="0 0 24 24" width="15" height="15" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path [attr.d]="n.icon"/>
            </svg>
            <span class="ri-file mono">{{ n.navFile }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="rail-foot">
    <a class="rf-link mono" [href]="links.linkedin" target="_blank" rel="noopener">→ linkedin</a>
    <a class="rf-link mono" [href]="links.github" target="_blank" rel="noopener">→ github</a>
  </div>
</aside>

@if (menuOpen()) { <div class="scrim" (click)="toggleMenu()"></div> }
